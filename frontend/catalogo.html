<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | Tianguis Digital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="barra-superior">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
          <span class="logo">TD</span>
          <span>Tianguis <span class="texto-elegante">Digital</span></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
          aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-lg-2">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link active" href="catalogo.html">Catálogo</a></li>
            <li class="nav-item">
              <a class="btn-bolsa" href="carrito.html" aria-label="Bolsa de compras">
                <i class="bi bi-bag"></i>
                <span id="contador-bolsa" class="contador-bolsa">0</span>
              </a>
            </li>
            <ul class="navbar-nav gap-lg-2" id="area-sesion"></ul>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <h1 class="h3 mb-4 titulo-seccion"><i class="bi bi-box-seam icono-acento me-2"></i>Catálogo de productos</h1>

    <div class="tarjeta p-4 mb-4">
      <form id="form-filtros">
        <div class="row g-3">
          <div class="col-md-6 col-lg-4 campo-form">
            <label for="filtro-busqueda">Buscar por nombre</label>
            <input type="search" class="form-control" id="filtro-busqueda" placeholder="Ej. laptop">
          </div>
          <div class="col-md-6 col-lg-2 campo-form">
            <label for="filtro-categoria">Categoría</label>
            <select class="form-select" id="filtro-categoria">
              <option value="">Todas</option>
            </select>
          </div>
          <div class="col-md-4 col-lg-2 campo-form">
            <label for="filtro-precio-min">Precio mín.</label>
            <input type="number" class="form-control" id="filtro-precio-min" placeholder="0" min="0">
          </div>
          <div class="col-md-4 col-lg-2 campo-form">
            <label for="filtro-precio-max">Precio máx.</label>
            <input type="number" class="form-control" id="filtro-precio-max" placeholder="50000" min="0">
          </div>
          <div class="col-md-4 col-lg-2 d-flex align-items-end gap-2">
            <button type="submit" class="btn-negro flex-grow-1"><i class="bi bi-funnel me-1"></i>Filtrar</button>
            <button type="button" id="btn-limpiar" class="btn-ghost">
              <i class="bi bi-x-circle me-1"></i>Limpiar
            </button>
          </div>
        </div>
      </form>
    </div>

    <div id="resultados" class="row g-3">
      <p class="text-muted">Cargando productos...</p>
    </div>
  </main>

  <footer class="pie-pagina mt-5">
    <div class="container py-4">
      <div class="row g-2 text-center text-md-start">
        <div class="col-md-4">
          <p class="mb-0"><i class="bi bi-geo-alt me-1"></i>Hecho en México</p>
        </div>
        <div class="col-md-4">
          <p class="mb-0"><i class="bi bi-envelope me-1"></i>soporte@tianguisdigital.mx</p>
        </div>
        <div class="col-md-4">
          <p class="mb-0"><i class="bi bi-telephone me-1"></i>+52 33 0000 0000</p>
        </div>
      </div>
      <p class="text-center mb-0 mt-3">Tianguis Digital &copy; 2026 &mdash; Examen Unidad 3.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js?v=20260815"></script>
  <script src="js/ui.js?v=20260815"></script>
  <script src="js/app.js?v=20260815"></script>
  <script src="js/catalogo.js?v=20260815"></script>
</body>
</html>
